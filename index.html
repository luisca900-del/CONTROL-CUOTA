<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InDrive: Real vs Meta</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2563eb"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="InDrive Meta"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--bd:#e5e7eb;--ok:#15803d;--okb:#dcfce7;--mid:#b45309;--midb:#fef3c7;--lo:#b91c1c;--lob:#fee2e2;--ac:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--tx:#eef0f3;--mu:#9aa3af;--bd:#2c313a;--ok:#4ade80;--okb:#14391f;--mid:#fbbf24;--midb:#3d2f0b;--lo:#f87171;--lob:#401818;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--tx:#eef0f3;--mu:#9aa3af;--bd:#2c313a;--ok:#4ade80;--okb:#14391f;--mid:#fbbf24;--midb:#3d2f0b;--lo:#f87171;--lob:#401818;--ac:#60a5fa}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:560px;margin-inline:auto}
h1{font-size:18px;margin:4px 0 10px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{font-size:16px;text-transform:capitalize}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.c small{color:var(--mu);display:block;font-size:12px}
.c strong{font-size:17px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.h{text-align:center;font-size:12px;color:var(--mu);padding:2px 0}
.d{min-height:58px;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font-size:11px}
.d span{font-size:12px;color:var(--mu)}
.d b{font-size:12px;text-align:right}
.d.ok{background:var(--okb);color:var(--ok)}.d.mid{background:var(--midb);color:var(--mid)}.d.lo{background:var(--lob);color:var(--lo)}
.d.t{outline:2px solid var(--ac)}.d.e{opacity:0;pointer-events:none}.d.off{opacity:.55}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:10px 0}
.m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.m.on{display:flex}
.box{max-height:92%;overflow:auto;background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.box input{width:100%;font-size:22px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:8px 0 12px}
.row{display:flex;gap:8px}.row button{flex:1}
.lb{flex:1;display:block;font-size:12px;color:var(--mu);min-width:0}.box .lb input{font-size:16px;margin:2px 0 8px}
.wr{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:4px;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--bd)}.wr.hd{color:var(--mu)}
details{margin-top:12px;font-size:13px;color:var(--mu)}
details input{width:90px;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
</style></head><body>
<h1>🚗 InDrive: Real vs Meta</h1>
<div class="nav"><button id="pv">‹</button><b id="mt"></b><button id="nx">›</button></div>
<div class="sum">
<div class="c"><small>Real del mes</small><strong id="sr"></strong></div>
<div class="c"><small>Meta del mes</small><strong id="sm"></strong></div>
<div class="c"><small>Diferencia hasta hoy</small><strong id="sd"></strong></div>
<div class="c"><small>Días con meta cumplida</small><strong id="sc"></strong></div>
</div>
<div class="bar"><i id="pb"></i></div>
<div class="g" id="g"></div>
<div class="leg"><span>🟩 Meta cumplida</span><span>🟨 70% a 99%</span><span>🟥 Menos de 70%</span></div>
<h1 style="font-size:15px;margin-top:14px">Resumen por semana</h1><div id="wk"></div>
<details><summary>Ajustar metas</summary>
<p>Lun a Vie: $ <input id="gw" type="number" inputmode="numeric"> &nbsp; Sábado: $ <input id="gs" type="number" inputmode="numeric"></p>
<p><button id="bx">Copiar respaldo</button> <button id="bi">Restaurar</button></p><textarea id="bt" rows="3" placeholder="Para restaurar, pega aquí el respaldo y toca Restaurar" style="width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px"></textarea></details>
<div class="m" id="m"><div class="box">
<b id="ml"></b><div style="color:var(--mu);font-size:13px" id="mg"></div>
<input id="mi" type="number" inputmode="numeric" placeholder="Ingreso del día ($)">
<div class="row"><button id="mx">Borrar</button><button id="mc">Cancelar</button><button class="p" id="ms">Guardar</button></div>
</div></div>
<script>
var $=function(i){return document.getElementById(i)};
function ld(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var data=ld('indrive-data',{}),goals=ld('indrive-goals',{w:80000,s:200000});
var now=new Date(),cur=new Date(now.getFullYear(),now.getMonth(),1),sel=null;
function key(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function goal(dow){return dow===0?0:dow===6?goals.s:goals.w}
function hd(a,b){if(!a||!b)return 0;var x=a.split(':'),y=b.split(':'),m=(+y[0]*60+ +y[1])-(+x[0]*60+ +x[1]);if(m<0)m+=1440;return Math.round(m/60*100)/100}
function ent(k){var x=data[k];if(x===undefined)return undefined;if(typeof x==='number')return{i:x,h:0,g:0};return x}
function fm(n){return '$'+Math.round(n).toLocaleString('es-CO')}
function sh(n){return n>=1000?(Math.round(n/100)/10)+'k':String(n)}
function render(){
var y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate(),first=(new Date(y,m,1).getDay()+6)%7;
$('mt').textContent=cur.toLocaleDateString('es-CO',{month:'long',year:'numeric'});
var h='';['L','M','M','J','V','S','D'].forEach(function(x){h+='<div class="h">'+x+'</div>'});
for(var i=0;i<first;i++)h+='<div class="d e"></div>';
var real=0,meta=0,metaHoy=0,realHoy=0,ok=0,gas=0,hrs=0,kms=0,wks={},tk=key(now.getFullYear(),now.getMonth(),now.getDate());
for(var d=1;d<=n;d++){
var k=key(y,m,d),dow=new Date(y,m,d).getDay(),g=goal(dow),en=ent(k),v=en?en.i:undefined,cl='d',txt='';
meta+=g;var wi=Math.ceil((d+first)/7);if(!wks[wi])wks[wi]={a:d,b:d,r:0,m:0,gs:0};wks[wi].b=d;wks[wi].m+=g;
if(k<=tk){metaHoy+=g}
if(v!==undefined){gas+=en.g||0;hrs+=en.h||0;kms+=en.k||0;wks[wi].r+=v;wks[wi].gs+=en.g||0;real+=v;if(k<=tk)realHoy+=v;txt=sh(v);
if(g===0)cl+=' ok';else{var p=v/g;if(p>=1){cl+=' ok';ok++}else if(p>=.7)cl+=' mid';else cl+=' lo'}}
else if(g===0)cl+=' off';
if(k===tk)cl+=' t';
h+='<div class="'+cl+'" data-k="'+k+'" data-g="'+g+'"><span>'+d+'</span><b>'+(txt||(g?'<span>'+sh(g)+'</span>':''))+'</b></div>';
}
$('g').innerHTML=h;
$('sr').textContent=fm(real);$('sm').textContent=fm(meta);
var df=realHoy-metaHoy;$('sd').textContent=(df>=0?'+':'−')+fm(Math.abs(df));
$('sd').style.color=df>=0?'var(--ok)':'var(--lo)';
$('sc').textContent=ok;

var w='<div class="wr hd"><span>Semana</span><span>Real</span><span>Meta</span><span>Cumpl.</span></div>';Object.keys(wks).forEach(function(i){var x=wks[i];w+='<div class="wr"><span>'+x.a+'–'+x.b+'</span><span>'+fm(x.r)+'</span><span>'+fm(x.m)+'</span><span>'+Math.round(x.m?x.r/x.m*100:0)+'%'+'</span></div>'});$('wk').innerHTML=w;
$('pb').style.width=Math.min(100,meta?real/meta*100:0)+'%';
}
$('g').onclick=function(e){
var el=e.target.closest('.d');if(!el||!el.dataset.k)return;
sel=el.dataset.k;var g=+el.dataset.g;
var p=sel.split('-');
$('ml').textContent=new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
$('mg').textContent=g?'Meta: '+fm(g):'Día libre (sin meta)';
var en=ent(sel);$('mi').value=en?en.i:'';
$('m').classList.add('on');setTimeout(function(){$('mi').focus()},50);
};
function close(){$('m').classList.remove('on')}
$('mc').onclick=close;
$('ms').onclick=function(){var v=parseFloat($('mi').value);if(!isNaN(v)){data[sel]={i:v};sv('indrive-data',data)}close();render()};
$('mx').onclick=function(){delete data[sel];sv('indrive-data',data);close();render()};
$('pv').onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$('nx').onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$('gw').value=goals.w;$('gs').value=goals.s;
$('gw').onchange=function(){goals.w=+this.value||0;sv('indrive-goals',goals);render()};
$('gs').onchange=function(){goals.s=+this.value||0;sv('indrive-goals',goals);render()};
$('bx').onclick=function(){var s=JSON.stringify({d:data,g:goals});$('bt').value=s;$('bt').select();try{navigator.clipboard.writeText(s)}catch(e){}};
$('bi').onclick=function(){try{var o=JSON.parse($('bt').value);if(o.d){data=o.d;sv('indrive-data',data)}if(o.g){goals=o.g;sv('indrive-goals',goals)}$('gw').value=goals.w;$('gs').value=goals.s;render();$('bt').value='Restaurado'}catch(e){$('bt').value='Respaldo inválido'}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
render();
</script></body></html>
